name: Auto Sync Pipeline

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment: Configure .env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Debug env presence (safe)
        run: |
            python - <<'PY'
            import os
            print("SUPABASE_URL present:", bool(os.environ.get("SUPABASE_URL")))
            print("SUPABASE_KEY present:", bool(os.environ.get("SUPABASE_KEY")))
            # If your script expects a .env file, check for that file:
            print(".env exists:", os.path.exists(".env"))
            PY
            
      - name: Run auto-sync
        env:
          POS_BASE_URL: ${{ secrets.POS_BASE_URL }}
          POS_USERNAME: ${{ secrets.POS_USERNAME }}
          POS_PASSWORD: ${{ secrets.POS_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m pos4africa.auto_sync all
